name: Generate Snake

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to the output branch
    
    steps:
      - name: Checkout repository
        # Updated from v4 to v6.0.2 for Node 24 support
        uses: actions/checkout@v6.0.2

      - name: Generate Snake Files
        # Updated from v3 to v3.5.0 (latest stable)
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: komaru-lol
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to Output Branch
        # Updated from v4 to v5 for Node 24 support
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
